# Ryoku ALSA audio: software volume for every ALSA card. The hardware mixer on
# some codecs (Realtek / generic HD-audio especially) has quirks -- coarse or
# dead steps, a master that comes up muted or muffled, level controls that fight
# the desktop -- so volume and mute run in software instead, for one consistent
# behaviour across all hardware and the source of most "audio randomly breaks"
# reports. Adapted from Omarchy's audio setup. Override in
# ~/.config/wireplumber/wireplumber.conf.d/.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
